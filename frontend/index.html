<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行程规划助手 · Plan-and-Solve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }

    header {
      display: flex; align-items: center; gap: 12px; padding: 16px 0 20px;
      border-bottom: 1px solid #1e293b; margin-bottom: 24px;
    }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; background: #3b82f6;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    header h1 { font-size: 20px; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .badge {
      margin-left: auto; font-size: 12px; color: #34d399; display: flex;
      align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }

    .input-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; margin-bottom: 24px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 180px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155;
      background: #0f172a; color: #e2e8f0; font-size: 15px; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      padding: 12px 22px; border-radius: 10px; border: none; background: #3b82f6;
      color: #fff; font-size: 15px; cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 20px; margin-bottom: 16px;
    }
    .card h3 { font-size: 15px; color: #e2e8f0; margin-bottom: 12px; }
    .weather {
      display: flex; align-items: center; gap: 10px; font-size: 15px; color: #fbbf24;
    }
    ol.plan { padding-left: 22px; }
    ol.plan li { margin: 8px 0; font-size: 14px; color: #cbd5e1; line-height: 1.6; }
    .step-item { border-top: 1px solid #334155; padding-top: 14px; margin-top: 14px; }
    .step-item:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .step-title { font-size: 13px; color: #60a5fa; margin-bottom: 8px; font-weight: 600; }
    .step-result {
      font-size: 14px; color: #e2e8f0; line-height: 1.7; white-space: pre-wrap;
      background: #0f172a; border-radius: 10px; padding: 12px 14px;
    }
    .final {
      background: linear-gradient(135deg, #1e293b, #1a2740);
      border-left: 4px solid #3b82f6;
    }
    .final .answer { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .loading { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 14px; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #334155; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <header>
      <div class="logo">🧭</div>
      <div>
        <h1>行程规划助手</h1>
        <p>Plan-and-Solve 范式 · 先规划，后执行</p>
      </div>
      <div class="badge"><span class="dot"></span> 服务运行中</div>
    </header>

    <div class="input-card">
      <div class="row">
        <div class="field">
          <label>想去的城市</label>
          <input v-model="city" placeholder="如：厦门" :disabled="loading" />
        </div>
        <div class="field">
          <label>计划天数</label>
          <input v-model="days" placeholder="如：3" :disabled="loading" />
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button @click="plan" :disabled="loading || !city.trim()">开始规划</button>
        </div>
      </div>
    </div>

    <div v-if="loading" class="card">
      <div class="loading"><span class="spinner"></span> 正在查询天气并规划行程…</div>
    </div>

    <template v-if="result">
      <div class="card">
        <h3>🌤 实时天气</h3>
        <div class="weather">{{ result.weather }}</div>
      </div>

      <div class="card" v-if="result.plan && result.plan.length">
        <h3>📋 规划步骤（生成 {{ result.plan.length }} 步）</h3>
        <ol class="plan">
          <li v-for="(step, i) in result.plan" :key="i">{{ step }}</li>
        </ol>
      </div>

      <div class="card" v-if="result.results && result.results.length">
        <h3>▶️ 逐步执行</h3>
        <div class="step-item" v-for="(r, i) in result.results" :key="i">
          <div class="step-title">步骤 {{ i+1 }}：{{ r.step }}</div>
          <div class="step-result">{{ r.result }}</div>
        </div>
      </div>

      <div class="card final" v-if="result.answer">
        <h3>✅ 最终建议</h3>
        <div class="answer">{{ result.answer }}</div>
      </div>
    </template>
  </div>

  <script src="/lib/vue.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: { city: "", days: "3", loading: false, result: null },
      methods: {
        plan: function () {
          var self = this;
          this.loading = true;
          this.result = null;
          fetch("/api/agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ city: this.city.trim(), days: this.days.trim() }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.error) { alert("出错：" + data.error); return; }
              self.result = data;
            })
            .catch(function (e) {
              alert("无法连接后端服务，请确认已运行后端程序。\n" + e.message);
            })
            .finally(function () { self.loading = false; });
        },
      },
    });
  </script>
</body>
</html>
